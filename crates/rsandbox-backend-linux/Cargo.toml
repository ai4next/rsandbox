[package]
name = "rsandbox-backend-linux"
description = "Linux-native isolation backend for rsandbox (namespaces, cgroup v2, seccomp-bpf, Landlock)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rsandbox-core.workspace = true
rsandbox-unix.workspace = true

# The backend is a no-op on non-Linux hosts, so its kernel-facing dependencies
# are only pulled in when actually compiling for Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
landlock = "0.4.7"
seccompiler = "0.5.0"

# The isolation tests drive the backend through the public API, as a user would.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rsandbox.workspace = true
