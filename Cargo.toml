[workspace]
resolver = "3"
members = [
    "crates/rsandbox",
    "crates/rsandbox-core",
    "crates/rsandbox-unix",
    "crates/rsandbox-backend-process",
    "crates/rsandbox-backend-linux",
    "crates/rsandbox-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://console.cloud.baidu-int.com/devops/icode/repos/baidu/nb"

[workspace.dependencies]
rsandbox = { path = "crates/rsandbox", version = "0.1.0" }
rsandbox-core = { path = "crates/rsandbox-core", version = "0.1.0" }
rsandbox-unix = { path = "crates/rsandbox-unix", version = "0.1.0" }
rsandbox-backend-process = { path = "crates/rsandbox-backend-process", version = "0.1.0" }
rsandbox-backend-linux = { path = "crates/rsandbox-backend-linux", version = "0.1.0" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
